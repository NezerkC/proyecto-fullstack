services:
  mongodb:
    image: mongo:7.0
    container_name: sonidovivo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./scripts/mongo/init-sonido-vivo.js:/docker-entrypoint-initdb.d/init-sonido-vivo.js:ro
      - mongo_data:/data/db
    mem_limit: 768m
    networks:
      - sonidovivo-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: sonidovivo-oracle
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: ${ORACLE_PASS:-secret}
    volumes:
      - ./scripts/oracle:/container-entrypoint-initdb.d:ro
      - oracle_data:/opt/oracle/oradata
    mem_limit: 3584m
    shm_size: 1g
    networks:
      - sonidovivo-net

  sonidovivo-backend:
    image: ghcr.io/nezerkc/sonido-vivo-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonidovivo-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/sonido_vivo_nosql}
      ORACLE_URL: ${ORACLE_URL:-jdbc:oracle:thin:@oracle-db:1521/FREEPDB1}
      ORACLE_USER: ${ORACLE_USER:-sonido_vivo}
      ORACLE_PASS: ${ORACLE_PASS:-secret}
      JWT_SECRET: ${JWT_SECRET:-SonidoVivoSecretKey2026SuperSecureTokenVal256Bits}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
      oracle-db:
        condition: service_started
    networks:
      - sonidovivo-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  sonidovivo-net:
    driver: bridge

volumes:
  mongo_data:
  oracle_data:
