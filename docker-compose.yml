services:
  mongodb:
    image: mongo:7.0
    container_name: sonidovivo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./backend/scripts/mongo/init-sonido-vivo.js:/docker-entrypoint-initdb.d/init-sonido-vivo.js:ro
      - mongo_data:/data/db
    mem_limit: 768m
    networks:
      - sonidovivo-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  oracle-db:
    image: ${ORACLE_IMAGE:-container-registry.oracle.com/database/free:latest}
    container_name: sonidovivo-oracle
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: ${ORACLE_PASS:-secret}
    volumes:
      - ./backend/scripts/oracle:/container-entrypoint-initdb.d:ro
      - oracle_data:/opt/oracle/oradata
    mem_limit: 3584m
    shm_size: 1g
    networks:
      - sonidovivo-net
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 90s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sonidovivo-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      VENDEDOR_USERNAME: ${VENDEDOR_USERNAME:-vendedor}
      VENDEDOR_PASSWORD: ${VENDEDOR_PASSWORD:-vendedor123}
      CLIENTE_USERNAME: ${CLIENTE_USERNAME:-usuario}
      CLIENTE_PASSWORD: ${CLIENTE_PASSWORD:-usuario123}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/sonido_vivo_nosql}
      ORACLE_URL: ${ORACLE_URL:-jdbc:oracle:thin:@oracle-db:1521/FREEPDB1}
      ORACLE_USER: ${ORACLE_USER:-sonido_vivo}
      ORACLE_PASS: ${ORACLE_PASS:-secret}
      HIKARI_CONNECTION_TIMEOUT: ${HIKARI_CONNECTION_TIMEOUT:-30000}
      HIKARI_VALIDATION_TIMEOUT: ${HIKARI_VALIDATION_TIMEOUT:-5000}
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-10}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-2}
      HIKARI_INIT_FAIL_TIMEOUT: ${HIKARI_INIT_FAIL_TIMEOUT:-60000}
      JWT_SECRET: ${JWT_SECRET:-SonidoVivoSecretKey2026SuperSecureTokenVal256Bits}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    mem_limit: 512m
    depends_on:
      mongodb:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
    networks:
      sonidovivo-net:
        aliases:
          - sonidovivo-backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 45s

  frontend:
    build:
      context: ./frontend/sonido-vivo-react
      dockerfile: Dockerfile
    container_name: sonidovivo-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sonidovivo-net

networks:
  sonidovivo-net:
    driver: bridge

volumes:
  mongo_data:
  oracle_data:
