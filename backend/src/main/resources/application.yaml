spring:
  application:
    name: sonidovivo
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/sonido_vivo_nosql}
  data:
    mongodb:
      auto-index-creation: true
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${ORACLE_USER:sonido_vivo}
    password: ${ORACLE_PASS:secret}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: SonidoVivoHikariPool
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1200000}
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      initialization-fail-timeout: ${HIKARI_INIT_FAIL_TIMEOUT:60000}
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    operations-sorter: method

