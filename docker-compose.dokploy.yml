# Dokploy / Proxmox CT100 Unified Compose Stack
# Connects backend and frontend to dokploy_dokploy-network for Traefik ingress and internal proxying.
services:
  sonidovivo-backend:
    image: sonidovivo-backend:latest
    container_name: sonidovivo-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-8085}:8080"
    mem_limit: 512m
    cpus: "1.0"
    environment:
      SERVER_PORT: 8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -Xmx320m -Xms128m}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-CHANGE_ME}
      VENDEDOR_USERNAME: ${VENDEDOR_USERNAME:-vendedor}
      VENDEDOR_PASSWORD: ${VENDEDOR_PASSWORD:-CHANGE_ME}
      CLIENTE_USERNAME: ${CLIENTE_USERNAME:-usuario}
      CLIENTE_PASSWORD: ${CLIENTE_PASSWORD:-CHANGE_ME}
      MONGO_URI: ${MONGO_URI:-mongodb://admin:${MONGO_PASSWORD:-CHANGE_ME}@192.168.3.150:27017/sonido_vivo_nosql?authSource=admin}
      ORACLE_URL: ${ORACLE_URL:-jdbc:oracle:thin:@192.168.3.150:1521/FREEPDB1}
      ORACLE_USER: ${ORACLE_USER:-SONIDO_VIVO}
      ORACLE_PASS: ${ORACLE_PASS:-CHANGE_ME}
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-5}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-1}
      HIKARI_CONNECTION_TIMEOUT: ${HIKARI_CONNECTION_TIMEOUT:-30000}
      HIKARI_VALIDATION_TIMEOUT: ${HIKARI_VALIDATION_TIMEOUT:-5000}
      HIKARI_INIT_FAIL_TIMEOUT: ${HIKARI_INIT_FAIL_TIMEOUT:-90000}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_MIN_32_BYTES_JWT_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://sonidovivo.nzrkc.com,http://192.168.3.150:5173,http://192.168.3.150,http://localhost:5173}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - dokploy-network

  sonidovivo-frontend:
    image: sonidovivo-frontend:latest
    container_name: sonidovivo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    mem_limit: 128m
    depends_on:
      sonidovivo-backend:
        condition: service_healthy
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy_dokploy-network"
      - "traefik.http.routers.sonidovivo.rule=Host(`sonidovivo.nzrkc.com`)"
      - "traefik.http.routers.sonidovivo.entrypoints=web"
      - "traefik.http.services.sonidovivo.loadbalancer.server.port=5173"

networks:
  dokploy-network:
    external: true
    name: dokploy_dokploy-network
